# ==========================================================================
# CRE WORKFLOW SETTINGS — MergeReward
# ==========================================================================
# Deploy with: cre workflow deploy --target staging-settings
# (or production-settings for mainnet)
#
# Required secrets (register via: cre secrets update):
#   GITHUB_TOKEN   — GitHub Personal Access Token with `repo` read scope.
#                    Used to call the GitHub REST API to verify PR merges.
#                    Stored encrypted in the TEE — never exposed on-chain.
#
#   BACKEND_TOKEN  — Bearer token for the MergeReward backend's internal API.
#                    Must match the CRE_BACKEND_TOKEN env var set on the server.
#                    Stored encrypted in the TEE — never exposed on-chain.
#
# These two secrets are the "Confidential HTTP" angle for the Privacy track:
# API keys stay inside the DON's TEE throughout execution.
# ==========================================================================

staging-settings:
  user-workflow:
    workflow-name: "mergereward"
  workflow-artifacts:
    workflow-path: "."
    config-path: "./config.json"
    secrets-path: "../secrets.yaml"

production-settings:
  user-workflow:
    workflow-name: "mergereward"
  workflow-artifacts:
    workflow-path: "."
    config-path: "./config.json"
    secrets-path: "../secrets.yaml"
