secretsNames:
    # MergeReward workflow secrets
    # GitHub Personal Access Token — read scope on target repos.
    # Used by the CRE workflow to call the GitHub REST API inside the TEE.
    GITHUB_TOKEN:
        - YOUR_GITHUB_TOKEN_HERE

    # Backend internal API token — must match CRE_BACKEND_TOKEN on the server.
    # Used by the CRE workflow to call /internal/payout and /internal/pending-payouts.
    BACKEND_TOKEN:
        - YOUR_BACKEND_TOKEN_HERE

    # PoR / NAV workflow secrets (kept for reference)
    SECRET_ID:
        - SECRET_VALUE
